name: ST STM32H750B Discovery Kit
type: mcu
arch: arm
toolchain:
  - zephyr
  - gnuarmemb
ram: 512
flash: 128
supported:
  - arduino_gpio
  - gpio
  - dma
  - flash
  - rtc
  - memc
  - display
  - spi
vendor: st
variants:
  stm32h750b_dk/stm32h750xx:
    twister: true
  stm32h750b_dk/stm32h750xx/ext_flash_app:
    twister: false
    sysbuild: true
    flash: 61439  # size in kB of 1 app slot minus MCUboot header size (1KB)
    toolchain:
      - zephyr
